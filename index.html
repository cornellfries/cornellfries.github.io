<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cornell Fries — Apps</title>
<style>
  :root { --bg: #0d0d0d; --card: #161616; --text: #e8e4da; --muted: #9a958a; --accent: #d4af37; --divider: #2a2a2a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); line-height: 1.65; padding: 3rem 1rem 4rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 42rem; margin: 0 auto; }
  h1 { font-size: 1.4rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--accent); text-align: center; margin-bottom: 2rem; }
  section.card { background: var(--card); border: 1px solid var(--divider); border-radius: 14px; padding: 1.4rem 1.5rem; margin-top: 1rem; }
  h2 { font-size: 1.15rem; }
  p { color: var(--muted); margin: 0.3rem 0 0.6rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Apps</h1>
  <section class="card">
    <h2>Corvus Noctis</h2>
    <p>Gesundheitsdaten aus Apple Health im Detail, mit Fokus auf die Nacht.</p>
    <a href="corvus-noctis/datenschutz/">Datenschutzerklärung / Privacy Policy</a>
  </section>
</main>
</body>
</html>
